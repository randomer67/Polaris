<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris - SZTU Academic Navigator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          surface: { 50:'#f8fafc', 100:'#f1f5f9', 800:'#0c1222', 900:'#060b16', 950:'#030712' },
          accent: { 400:'#2dd4bf', 500:'#14b8a6', 600:'#0d9488' }
        }
      }}
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes glow { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
    .fade-up { animation: fadeUp .4s ease-out both; }
    .card-hover { transition: all .2s; }
    .card-hover:hover { border-color: rgba(45,212,191,.3); box-shadow: 0 8px 32px rgba(0,0,0,.1); }
    .dark .card-hover:hover { border-color: rgba(45,212,191,.25); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    .dark .skeleton { background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%); background-size: 200% 100%; }
    .hero-glow { position:absolute; border-radius:50%; filter:blur(100px); pointer-events:none; animation: glow 4s ease-in-out infinite; }
    .nav-blur { backdrop-filter: blur(20px) saturate(180%); }
    .input-focus:focus { border-color: rgba(45,212,191,.5); box-shadow: 0 0 0 3px rgba(45,212,191,.1); }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#334155; border-radius:2px; }
  </style>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- 导航栏 -->
  <nav class="sticky top-0 z-40 nav-blur bg-white/60 dark:bg-surface-950/60 border-b border-gray-200/50 dark:border-gray-800/50">
    <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-400 to-accent-600 flex items-center justify-center shadow-lg shadow-accent-500/20">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight leading-tight">Polaris</h1>
          <p class="text-[10px] text-gray-400 tracking-widest uppercase leading-tight">SZTU</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="toggleFavorites()" class="relative px-3 py-2 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/60 transition flex items-center gap-1.5 text-gray-500 dark:text-gray-400">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span class="hidden sm:inline text-xs">收藏</span>
          <span id="favCount" class="absolute -top-0.5 -right-0.5 bg-accent-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
        </button>
        <button onclick="toggleDark()" class="w-8 h-8 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/60 flex items-center justify-center transition text-gray-500 dark:text-gray-400">
          <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="max-w-6xl mx-auto px-6 py-10">

    <!-- Hero -->
    <div id="heroSection" class="relative text-center mb-14 overflow-hidden py-6">
      <div class="hero-glow bg-accent-400/30 dark:bg-accent-500/10" style="width:400px;height:400px;top:-150px;left:30%;"></div>
      <div class="relative z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent-500/5 text-accent-600 dark:text-accent-400 text-[11px] font-medium mb-6 border border-accent-500/10">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Shenzhen Technology University
        </div>
        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-4">
          <span class="bg-gradient-to-r from-gray-900 via-accent-600 to-gray-900 dark:from-gray-100 dark:via-accent-400 dark:to-gray-100 bg-clip-text text-transparent">探索全球顶级学术成果</span>
        </h2>
        <p class="text-gray-400 max-w-lg mx-auto text-sm leading-relaxed">聚合全球开放获取学术资源，一站式检索顶级期刊与会议论文</p>
        <div class="grid grid-cols-3 gap-3 max-w-sm mx-auto mt-10">
          <div class="rounded-xl p-4 bg-white dark:bg-surface-800/50 border border-gray-100 dark:border-gray-800/80">
            <div class="text-xl font-extrabold">2.6亿+</div>
            <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider">文献总量</div>
          </div>
          <div class="rounded-xl p-4 bg-white dark:bg-surface-800/50 border border-gray-100 dark:border-gray-800/80">
            <div class="text-xl font-extrabold">8</div>
            <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider">优势学科</div>
          </div>
          <div class="rounded-xl p-4 bg-white dark:bg-surface-800/50 border border-gray-100 dark:border-gray-800/80">
            <div class="text-xl font-extrabold">2</div>
            <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider">数据源</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 搜索框 -->
    <div id="searchBox" class="bg-white dark:bg-surface-800/40 rounded-2xl border border-gray-200/60 dark:border-gray-800/60 p-6 mb-8">
      <div class="flex flex-wrap gap-2 mb-5" id="disciplineTags"></div>
      <div class="flex gap-3">
        <div class="flex-1 relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-300 dark:text-gray-600" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="text" placeholder="输入关键词、论文标题或作者名..."
            class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-surface-900/60 border border-gray-200/60 dark:border-gray-800 rounded-xl input-focus outline-none transition text-sm placeholder:text-gray-300 dark:placeholder:text-gray-600">
        </div>
        <button onclick="doSearch(1)" id="searchBtn" class="px-6 py-3 bg-accent-500 hover:bg-accent-600 text-white rounded-xl transition font-medium text-sm whitespace-nowrap shadow-sm shadow-accent-500/20">检索</button>
      </div>
      <div class="flex flex-wrap items-center gap-5 mt-4 text-sm">
        <div class="flex items-center gap-2">
          <label class="text-gray-400 text-[11px] font-medium uppercase tracking-wider">排序</label>
          <select id="sortSelect" class="bg-gray-50 dark:bg-surface-900/60 border border-gray-200/60 dark:border-gray-800 rounded-lg px-3 py-1.5 text-xs outline-none cursor-pointer">
            <option value="relevance">相关度</option>
            <option value="citationCount">引用量最高</option>
            <option value="publicationDate">最新发布</option>
          </select>
        </div>
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="oaOnly" class="w-3.5 h-3.5 rounded border-gray-300 text-accent-500 cursor-pointer">
          <span class="text-xs text-gray-400">仅开放获取 (Open Access)</span>
        </label>
      </div>
    </div>

    <!-- 搜索结果区 -->
    <div id="resultsArea" class="hidden">
      <div class="flex justify-between items-center mb-5">
        <p id="resultSummary" class="text-xs text-gray-400 font-medium"></p>
        <button onclick="clearSearch()" class="text-xs text-accent-500 hover:text-accent-400 font-medium transition">清除搜索</button>
      </div>
      <div id="results" class="space-y-3"></div>
      <div id="pagination" class="flex justify-center gap-1.5 mt-10"></div>
    </div>

    <!-- 收藏面板 -->
    <div id="favoritesPanel" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          我的收藏
        </h3>
        <button onclick="toggleFavorites()" class="text-xs text-accent-500 hover:text-accent-400 font-medium transition">返回搜索</button>
      </div>
      <div id="favList" class="space-y-3"></div>
      <p id="favEmpty" class="text-center text-gray-400 py-16 hidden">还没有收藏任何论文<br><span class="text-xs">搜索后点击书签图标即可收藏</span></p>
    </div>

  </main>

  <script>
  // ===== 配置 =====
  const DISCIPLINES = [
    { label:'全部', value:'' },
    { label:'计算机科学', value:'Computer Science' },
    { label:'人工智能', value:'Artificial Intelligence' },
    { label:'电子工程', value:'Engineering' },
    { label:'生物医学', value:'Medicine' },
    { label:'材料科学', value:'Materials Science' },
    { label:'数学', value:'Mathematics' },
    { label:'物理学', value:'Physics' },
    { label:'化学', value:'Chemistry' }
  ];
  const PER_PAGE = 10;
  let currentPage = 1, totalResults = 0, currentQuery = '';
  let selectedDisc = '', isSearching = false, lastSearchTime = 0;
  let favorites = JSON.parse(localStorage.getItem('polaris_favs') || '[]');

  // ===== 初始化 =====
  function init() {
    renderDisciplineTags();
    updateFavCount();
    if (localStorage.getItem('polaris_dark') === '1') {
      document.documentElement.classList.add('dark');
      document.getElementById('iconMoon').classList.add('hidden');
      document.getElementById('iconSun').classList.remove('hidden');
    }
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch(1);
    });
  }

  // ===== 学科标签 =====
  function renderDisciplineTags() {
    const container = document.getElementById('disciplineTags');
    container.innerHTML = DISCIPLINES.map((d, i) =>
      `<button onclick="selectDisc('${d.value}', this)" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition
        ${i===0 ? 'border-accent-500/50 bg-accent-500/10 text-accent-600 dark:text-accent-400' : 'border-gray-200 dark:border-gray-700 text-gray-500 hover:border-accent-500/30 hover:text-accent-500'}"
        data-disc="${d.value}">${d.label}</button>`
    ).join('');
  }

  function selectDisc(value, el) {
    selectedDisc = value;
    document.querySelectorAll('#disciplineTags button').forEach(b => {
      b.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border transition border-gray-200 dark:border-gray-700 text-gray-500 hover:border-accent-500/30 hover:text-accent-500';
    });
    el.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border transition border-accent-500/50 bg-accent-500/10 text-accent-600 dark:text-accent-400';
  }

  // ===== 搜索 =====
  async function doSearch(page = 1) {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    const now = Date.now();
    if (now - lastSearchTime < 1200) return;
    lastSearchTime = now;
    if (isSearching) return;

    isSearching = true;
    currentPage = page;
    currentQuery = query;
    const btn = document.getElementById('searchBtn');
    btn.textContent = '搜索中...';
    btn.disabled = true;

    document.getElementById('heroSection').classList.add('hidden');
    document.getElementById('favoritesPanel').classList.add('hidden');
    document.getElementById('resultsArea').classList.remove('hidden');
    document.getElementById('results').innerHTML = renderSkeletons();
    document.getElementById('pagination').innerHTML = '';

    try {
      const offset = (page - 1) * PER_PAGE;
      const sort = document.getElementById('sortSelect').value;
      const oaOnly = document.getElementById('oaOnly').checked;
      let url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&offset=${offset}&limit=${PER_PAGE}&fields=title,authors,year,citationCount,tldr,openAccessPdf,url,venue,abstract,externalIds`;
      if (selectedDisc) url += `&fieldsOfStudy=${encodeURIComponent(selectedDisc)}`;
      if (oaOnly) url += `&openAccessPdf=`;
      if (sort === 'citationCount') url += `&sort=citationCount:desc`;
      else if (sort === 'publicationDate') url += `&sort=publicationDate:desc`;

      const res = await fetch(url);
      if (res.status === 429) {
        throw new Error('请求过于频繁，请稍等一分钟后再试。Semantic Scholar 对未认证用户有速率限制。');
      }
      if (!res.ok) throw new Error(`请求失败 (${res.status})，请稍后重试。`);
      const data = await res.json();
      totalResults = data.total || 0;
      renderResults(data.data || []);
      renderPagination();
    } catch (err) {
      document.getElementById('results').innerHTML = `
        <div class="rounded-xl p-6 bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-800/30 text-center fade-up">
          <p class="text-red-600 dark:text-red-400 text-sm font-medium">⚠️ ${err.message}</p>
          <p class="text-red-400 dark:text-red-500 text-xs mt-2">建议：等待60秒后重试，或申请 API Key 获得更高速率</p>
        </div>`;
    } finally {
      isSearching = false;
      btn.textContent = '检索';
      btn.disabled = false;
    }
  }

  // ===== 渲染结果 =====
  function renderResults(papers) {
    const summary = document.getElementById('resultSummary');
    summary.textContent = `共找到约 ${totalResults.toLocaleString()} 条结果`;
    if (!papers.length) {
      document.getElementById('results').innerHTML = `
        <div class="text-center py-16 text-gray-400 fade-up">
          <p class="text-lg mb-2">未找到相关论文</p>
          <p class="text-sm">尝试更换关键词或使用英文搜索</p>
        </div>`;
      return;
    }
    document.getElementById('results').innerHTML = papers.map((p, i) => {
      const isFav = favorites.some(f => f.paperId === p.paperId);
      const authors = (p.authors || []).slice(0, 3).map(a => a.name).join(', ');
      const moreAuthors = (p.authors || []).length > 3 ? ` +${p.authors.length - 3}` : '';
      const year = p.year || '';
      const venue = p.venue || '';
      const citations = p.citationCount != null ? p.citationCount.toLocaleString() : '—';
      const tldr = p.tldr?.text || p.abstract?.substring(0, 200) || '';
      const hasPdf = !!p.openAccessPdf?.url;
      const doi = p.externalIds?.DOI || '';
      return `
        <div class="bg-white dark:bg-surface-800/40 rounded-xl border border-gray-200/60 dark:border-gray-800/60 p-5 card-hover fade-up" style="animation-delay:${i*50}ms">
          <div class="flex justify-between items-start gap-3">
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-sm leading-snug mb-2 line-clamp-2">
                ${p.url ? `<a href="${p.url}" target="_blank" class="hover:text-accent-500 transition">${escHtml(p.title)}</a>` : escHtml(p.title)}
              </h3>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-gray-400 mb-2">
                ${authors ? `<span class="truncate max-w-[200px]">${escHtml(authors)}${moreAuthors}</span>` : ''}
                ${year ? `<span>${year}</span>` : ''}
                ${venue ? `<span class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-gray-500">${escHtml(venue)}</span>` : ''}
              </div>
              ${tldr ? `<p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed line-clamp-2 mb-3">${escHtml(tldr)}</p>` : ''}
              <div class="flex flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-400 text-[11px] font-medium">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
                  ${citations} 引用
                </span>
                ${hasPdf ? `<a href="${p.openAccessPdf.url}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 text-[11px] font-medium hover:opacity-80 transition">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  PDF</a>` : ''}
                ${doi ? `<a href="https://doi.org/${doi}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-[11px] font-medium hover:opacity-80 transition">DOI</a>` : ''}
              </div>
            </div>
            <button onclick="toggleFav('${p.paperId}', this)" class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700/50 transition ${isFav ? 'text-accent-500' : 'text-gray-300 dark:text-gray-600'}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
          </div>
        </div>`;
    }).join('');
  }

  // ===== 分页 =====
  function renderPagination() {
    const totalPages = Math.min(Math.ceil(totalResults / PER_PAGE), 100);
    if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let pages = [];
    const start = Math.max(1, currentPage - 2);
    const end = Math.min(totalPages, currentPage + 2);
    if (start > 1) { pages.push(1); if (start > 2) pages.push('...'); }
    for (let i = start; i <= end; i++) pages.push(i);
    if (end < totalPages) { if (end < totalPages - 1) pages.push('...'); pages.push(totalPages); }

    document.getElementById('pagination').innerHTML = pages.map(p =>
      p === '...' ? `<span class="w-8 h-8 flex items-center justify-center text-gray-400 text-xs">…</span>` :
      `<button onclick="doSearch(${p})" class="w-8 h-8 rounded-lg text-xs font-medium transition
        ${p === currentPage ? 'bg-accent-500 text-white shadow-sm' : 'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500'}">${p}</button>`
    ).join('');
  }

  // ===== 骨架屏 =====
  function renderSkeletons() {
    return Array(5).fill('').map(() => `
      <div class="bg-white dark:bg-surface-800/40 rounded-xl border border-gray-200/60 dark:border-gray-800/60 p-5">
        <div class="skeleton h-4 w-3/4 mb-3"></div>
        <div class="skeleton h-3 w-1/2 mb-2"></div>
        <div class="skeleton h-3 w-full mb-2"></div>
        <div class="skeleton h-3 w-2/3"></div>
      </div>`).join('');
  }

  // ===== 收藏 =====
  function toggleFav(paperId, btn) {
    const idx = favorites.findIndex(f => f.paperId === paperId);
    if (idx >= 0) {
      favorites.splice(idx, 1);
      btn.classList.remove('text-accent-500');
      btn.classList.add('text-gray-300', 'dark:text-gray-600');
      btn.querySelector('svg').setAttribute('fill', 'none');
    } else {
      const card = btn.closest('.card-hover') || btn.closest('[class*="bg-white"]');
      const title = card?.querySelector('h3')?.textContent?.trim() || '';
      const authors = card?.querySelector('.text-\\[11px\\]')?.textContent?.trim() || '';
      favorites.push({ paperId, title, authors, time: Date.now() });
      btn.classList.add('text-accent-500');
      btn.classList.remove('text-gray-300', 'dark:text-gray-600');
      btn.querySelector('svg').setAttribute('fill', 'currentColor');
    }
    localStorage.setItem('polaris_favs', JSON.stringify(favorites));
    updateFavCount();
  }

  function updateFavCount() {
    const el = document.getElementById('favCount');
    if (favorites.length > 0) {
      el.textContent = favorites.length;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function toggleFavorites() {
    const panel = document.getElementById('favoritesPanel');
    const results = document.getElementById('resultsArea');
    const hero = document.getElementById('heroSection');
    const searchBox = document.getElementById('searchBox');

    if (!panel.classList.contains('hidden')) {
      panel.classList.add('hidden');
      hero.classList.remove('hidden');
      return;
    }
    hero.classList.add('hidden');
    results.classList.add('hidden');
    panel.classList.remove('hidden');

    const list = document.getElementById('favList');
    const empty = document.getElementById('favEmpty');
    if (!favorites.length) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    list.innerHTML = favorites.map((f, i) => `
      <div class="bg-white dark:bg-surface-800/40 rounded-xl border border-gray-200/60 dark:border-gray-800/60 p-4 fade-up" style="animation-delay:${i*50}ms">
        <div class="flex justify-between items-start">
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold text-sm mb-1 line-clamp-2">${escHtml(f.title)}</h3>
            <p class="text-[11px] text-gray-400 truncate">${escHtml(f.authors)}</p>
          </div>
          <button onclick="removeFav('${f.paperId}')" class="text-gray-300 hover:text-red-400 transition ml-2 flex-shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>`).join('');
  }

  function removeFav(paperId) {
    favorites = favorites.filter(f => f.paperId !== paperId);
    localStorage.setItem('polaris_favs', JSON.stringify(favorites));
    updateFavCount();
    toggleFavorites();
    toggleFavorites();
  }

  // ===== 工具函数 =====
  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('resultsArea').classList.add('hidden');
    document.getElementById('heroSection').classList.remove('hidden');
    document.getElementById('pagination').innerHTML = '';
  }

  function toggleDark() {
    const html = document.documentElement;
    html.classList.toggle('dark');
    const isDark = html.classList.contains('dark');
    localStorage.setItem('polaris_dark', isDark ? '1' : '0');
    document.getElementById('iconMoon').classList.toggle('hidden', isDark);
    document.getElementById('iconSun').classList.toggle('hidden', !isDark);
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
  </script>
</body>
</html>
