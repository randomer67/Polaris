<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学术论文搜索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5; color: #333; min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 40px 20px 30px; text-align: center; color: #fff;
  }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header p { font-size: 14px; opacity: 0.8; }
  .search-box {
    max-width: 720px; margin: -24px auto 0; padding: 0 16px; position: relative; z-index: 2;
  }
  .search-row {
    display: flex; gap: 8px; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12); padding: 6px;
  }
  .search-row input {
    flex: 1; border: none; outline: none; font-size: 16px; padding: 12px 16px;
    border-radius: 8px; background: transparent;
  }
  .search-row button {
    padding: 12px 28px; background: #0f3460; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600;
    transition: background 0.2s;
  }
  .search-row button:hover { background: #1a4a8a; }
  .filters {
    max-width: 720px; margin: 12px auto 0; padding: 0 16px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .filters label { font-size: 13px; color: #555; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .filters select {
    padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; background: #fff; cursor: pointer;
  }
  .container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
  .status { text-align: center; padding: 40px 20px; color: #888; font-size: 15px; }
  .status.error { color: #e74c3c; }
  .paper-card {
    background: #fff; border-radius: 10px; padding: 20px 24px; margin-bottom: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06); transition: box-shadow 0.2s;
  }
  .paper-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .paper-title {
    font-size: 17px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px; line-height: 1.4;
  }
  .paper-title a { color: #1a1a2e; text-decoration: none; }
  .paper-title a:hover { color: #0f3460; text-decoration: underline; }
  .paper-meta { font-size: 13px; color: #666; margin-bottom: 6px; line-height: 1.5; }
  .paper-meta span { margin-right: 14px; }
  .paper-abstract {
    font-size: 13.5px; color: #555; line-height: 1.6; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .paper-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; background: #e8f0fe; color: #1967d2; }
  .tag.oa { background: #e6f4ea; color: #137333; }
  .pagination { display: flex; justify-content: center; gap: 8px; margin: 24px 0 40px; }
  .pagination button {
    padding: 8px 18px; border: 1px solid #ddd; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 14px; transition: all 0.2s;
  }
  .pagination button:hover:not(:disabled) { background: #0f3460; color: #fff; border-color: #0f3460; }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination .page-info { padding: 8px 12px; font-size: 14px; color: #666; }
  .spinner {
    display: inline-block; width: 20px; height: 20px; border: 2px solid #ddd;
    border-top-color: #0f3460; border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    .header h1 { font-size: 22px; }
    .search-row { flex-direction: column; }
    .search-row button { width: 100%; }
    .paper-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>📚 学术论文搜索</h1>
  <p>基于 OpenAlex 开放学术数据库 · 覆盖 2 亿+ 篇文献</p>
</div>
<div class="search-box">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="输入关键词搜索论文，如：machine learning, 集成电路..."
           onkeydown="if(event.key==='Enter')doSearch(1)">
    <button onclick="doSearch(1)">搜索</button>
  </div>
  <div class="filters">
    <label>排序：
      <select id="sortSelect">
        <option value="relevance_score:desc">相关度</option>
        <option value="cited_by_count:desc">引用数</option>
        <option value="publication_year:desc">最新发表</option>
      </select>
    </label>
    <label>年份：
      <select id="yearSelect">
        <option value="">全部</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
      </select>
    </label>
    <label><input type="checkbox" id="oaOnly"> 仅开放获取 (OA)</label>
  </div>
</div>
<div class="container" id="results">
  <div class="status">输入关键词开始搜索论文 🔍</div>
</div>
<script>
const PER_PAGE = 10;
let currentQuery = '';
let totalResults = 0;

async function doSearch(page = 1) {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('请输入搜索关键词'); return; }
  currentQuery = query;
  const container = document.getElementById('results');
  container.innerHTML = '<div class="status"><span class="spinner"></span>正在搜索...</div>';
  const sort = document.getElementById('sortSelect').value;
  const year = document.getElementById('yearSelect').value;
  const oaOnly = document.getElementById('oaOnly').checked;
  let url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&sort=${sort}&per_page=${PER_PAGE}&offset=${(page-1)*PER_PAGE}`;
  let filters = [];
  if (year) filters.push(`publication_year:${year}`);
  if (oaOnly) filters.push(`open_access.is_oa:true`);
  if (filters.length > 0) url += `&filter=${filters.join(',')}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) {
      if (resp.status === 429) throw new Error('请求太频繁，请稍等 30 秒后再试');
      throw new Error(`搜索出错 (HTTP ${resp.status})，请稍后重试`);
    }
    const data = await resp.json();
    totalResults = data.meta?.count || 0;
    const papers = data.results || [];
    if (papers.length === 0) {
      container.innerHTML = '<div class="status">未找到相关论文，试试换个关键词？</div>';
      return;
    }
    let html = `<div class="status" style="text-align:left;padding:10px 0;font-size:14px;color:#888;">共找到约 <b style="color:#333">${totalResults.toLocaleString()}</b> 篇相关论文</div>`;
    papers.forEach(p => {
      const title = p.title || '无标题';
      const doi = p.doi || '';
      const link = p.doi_url || p.id || '#';
      const year = p.publication_year || '未知';
      const venue = p.primary_location?.source?.display_name || p.host_venue?.display_name || '';
      const cited = p.cited_by_count || 0;
      const isOa = p.open_access?.is_oa;
      const pdfUrl = p.open_access?.oa_url;
      const authors = (p.authorships || []).map(a => a.author?.display_name).filter(Boolean).slice(0, 5).join(', ');
      const moreAuthors = (p.authorships || []).length > 5 ? ' 等' : '';
      const abstract = p.abstract_inverted_index ? reconstructAbstract(p.abstract_inverted_index) : '';
      html += `<div class="paper-card">
        <div class="paper-title"><a href="${link}" target="_blank" rel="noopener">${escapeHtml(title)}</a></div>
        <div class="paper-meta">
          <span>👤 ${escapeHtml(authors)}${moreAuthors}</span>
          <span>📅 ${year}</span>
          ${venue ? `<span>📖 ${escapeHtml(venue)}</span>` : ''}
          <span>🔗 引用 ${cited}</span>
        </div>
        ${abstract ? `<div class="paper-abstract">${escapeHtml(abstract)}</div>` : ''}
        <div class="paper-tags">
          ${isOa && pdfUrl ? `<a href="${pdfUrl}" target="_blank" class="tag oa">📄 免费全文</a>` : ''}
          ${doi ? `<span class="tag">DOI: ${escapeHtml(doi.replace('https://doi.org/',''))}</span>` : ''}
        </div>
      </div>`;
    });
    const totalPages = Math.ceil(totalResults / PER_PAGE);
    if (totalPages > 1) {
      html += `<div class="pagination">
        <button onclick="doSearch(${page-1})" ${page<=1?'disabled':''}>上一页</button>
        <span class="page-info">第 ${page} / ${Math.min(totalPages, 999)} 页</span>
        <button onclick="doSearch(${page+1})" ${page>=totalPages?'disabled':''}>下一页</button>
      </div>`;
    }
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="status error">❌ ${escapeHtml(err.message)}</div>`;
  }
}
function reconstructAbstract(invIndex) {
  if (!invIndex) return '';
  const words = [];
  for (const [word, positions] of Object.entries(invIndex)) {
    positions.forEach(pos => { words[pos] = word; });
  }
  return words.join(' ').substring(0, 500);
}
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
